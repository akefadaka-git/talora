name: Android test APK

on:
  push:
    branches:
      - "feat/android-offline-test-mvp"
  pull_request:
    branches:
      - main
      - "docs/talora-iroka-a2-reconciliation-v0.1.1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-apk:
    name: Build, unit test and package debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run unit tests and assemble APK
        run: gradle -p android testDebugUnitTest lintDebug assembleDebug --no-daemon

      - name: Upload Android lint and accessibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: talora-android-lint-report
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: talora-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
