name: Android test APK

on:
  push:
    branches:
      - "feat/android-offline-test-mvp"
  pull_request:
    branches:
      - main
      - "docs/talora-iroka-a2-reconciliation-v0.1.1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-apk:
    name: Build, unit test and package debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify checked-out source revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "Expected source SHA: $EXPECTED_SHA"
          echo "Checked-out source SHA: $ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Run unit tests and assemble APK
        run: gradle -p android testDebugUnitTest lintDebug assembleDebug --no-daemon

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: talora-android-unit-test-reports
          path: |
            android/app/build/test-results/testDebugUnitTest/**
            android/app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Android lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: talora-android-lint-report
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: talora-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  android-emulator-smoke:
    name: Install, launch, lifecycle, SAF and accessibility smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify checked-out source revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "Expected source SHA: $EXPECTED_SHA"
          echo "Checked-out source SHA: $ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Run Android 16 emulator tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 37
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: gradle -p android connectedDebugAndroidTest --no-daemon

      - name: Upload device-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: talora-android-emulator-reports
          path: |
            android/app/build/reports/androidTests/connected/**
            android/app/build/outputs/androidTest-results/connected/**
          if-no-files-found: ignore
          retention-days: 14
